name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          mkdir -p dist/macos-arm64
          go build -trimpath -ldflags="-s -w -X example.com/cx/internal/version.Version=${GITHUB_REF_NAME}" -o dist/macos-arm64/cxj ./cmd/cxj
          chmod +x dist/macos-arm64/cxj
          file dist/macos-arm64/cxj

      - name: Package
        run: |
          cp scripts/release-readme.txt dist/macos-arm64/README.txt
          (cd dist/macos-arm64 && zip -r ../cxj-macos-arm64.zip cxj README.txt)
          ls -lh dist/cxj-macos-arm64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cxj-macos-arm64.zip
          generate_release_notes: true
