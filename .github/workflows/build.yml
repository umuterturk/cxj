name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          mkdir -p dist/macos-arm64
          go build -trimpath -ldflags="-s -w" -o dist/macos-arm64/cxj ./cmd/cxj
          file dist/macos-arm64/cxj

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cxj-macos-arm64
          path: dist/macos-arm64/cxj
          if-no-files-found: error

  # Performance is the product: statelessness means every agent call pays a cold
  # Open, so a regression here is a regression in the thing we sell. Gated on the
  # deterministic fixture, never on a real repository.
  perf:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: In-process benchmarks
        run: |
          go test ./internal/engine -run '^$' -bench Benchmark -benchtime=3x -timeout 20m

      - name: Perf gate (fixture, tolerance x2.0 on shared runners)
        run: ./scripts/perf-bench.sh --runs 5

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: dist/perf/results.txt
          if-no-files-found: warn
